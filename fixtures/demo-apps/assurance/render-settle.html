<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Render settling assurance</title>
    <style>
      @keyframes settle-target {
        from { transform: translateX(0); }
        to { transform: translateX(160px); }
      }

      body {
        margin: 0;
        background: #f3efe6;
        color: #17211b;
        font-family: system-ui, sans-serif;
      }

      main {
        width: 560px;
        margin: 80px auto;
        padding: 32px;
        border: 1px solid currentColor;
        background: white;
      }

      [data-assurance-track] {
        width: 400px;
        padding: 8px;
        border: 1px solid currentColor;
      }

      button {
        min-width: 180px;
        min-height: 44px;
        border: 1px solid currentColor;
        background: #ff5a36;
        color: white;
        font: inherit;
        animation: settle-target 1200ms linear forwards;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Render settling assurance</h1>
      <p>The target reaches one durable position before capture.</p>
      <div data-assurance-track>
        <button type="button">Review settled state</button>
      </div>
    </main>
  </body>
</html>
