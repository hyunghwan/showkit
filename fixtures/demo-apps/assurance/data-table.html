<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data table fidelity assurance</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1280px;
        height: 720px;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #f3efe6;
        color: #17211b;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: 980px;
        margin: 56px auto;
      }

      h1 {
        margin: 0 0 22px;
        font-size: 30px;
      }

      .table-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }

      .table-card {
        min-height: 330px;
        padding: 18px;
        border: 1px solid #17211b;
        border-radius: 14px;
        background: #fffdf8;
      }

      table {
        width: 100%;
        color: #17211b;
        font-size: 14px;
      }

      caption {
        margin-bottom: 12px;
        text-align: left;
        font-size: 17px;
        font-weight: 700;
      }

      th,
      td {
        padding: 12px;
        text-align: left;
      }

      .collapsed {
        border-collapse: collapse;
      }

      .collapsed th,
      .collapsed td {
        border: 2px solid #55309f;
      }

      .separated {
        border-collapse: separate;
        border-spacing: 10px 8px;
        background: #d8d0ea;
      }

      .separated th,
      .separated td {
        border: 1px solid #2f6f61;
        border-radius: 8px;
        background: white;
      }

      .status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        background: #d8f3df;
        color: #175b35;
        font-weight: 700;
      }

      button {
        min-height: 44px;
        margin-top: 22px;
        padding: 10px 18px;
        border: 1px solid #55309f;
        border-radius: 9px;
        background: #7d4be2;
        color: white;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Data table fidelity assurance</h1>
      <div class="table-grid">
        <section class="table-card" aria-label="Collapsed data table">
          <table class="collapsed">
            <caption>Open work orders</caption>
            <thead>
              <tr><th>Asset</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr><td>Cooling unit</td><td><span class="status">Ready</span></td></tr>
              <tr><td>Loading gate</td><td>Assigned</td></tr>
            </tbody>
          </table>
        </section>
        <section class="table-card" aria-label="Separated data table">
          <table class="separated">
            <caption>Inspection queue</caption>
            <tbody>
              <tr><th>Today</th><td>12 checks</td></tr>
              <tr><th>Tomorrow</th><td>8 checks</td></tr>
            </tbody>
          </table>
        </section>
      </div>
      <button type="button">Review operations table</button>
    </main>
  </body>
</html>
