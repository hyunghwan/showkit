<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Native dialog assurance</title>
    <style>
      body { margin: 0; min-height: 720px; font: 16px Arial, sans-serif; background: #f4f1e9; }
      dialog { width: 360px; padding: 28px; border: 0; border-radius: 16px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25); }
      button { min-width: 120px; min-height: 42px; }
    </style>
  </head>
  <body>
    <dialog open aria-labelledby="dialog-title">
      <h1 id="dialog-title">Confirm presentation</h1>
      <p>Review the final settings before continuing.</p>
      <button type="button">Continue</button>
    </dialog>
  </body>
</html>
