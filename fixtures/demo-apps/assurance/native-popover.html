<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Native popover assurance</title>
    <style>
      body {
        margin: 0;
        background: #f3efe6;
        color: #17211b;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: 520px;
        margin: 80px auto;
        padding: 32px;
        border: 1px solid currentColor;
        background: white;
      }

      button {
        min-height: 44px;
        padding: 10px 18px;
        border: 1px solid #55309f;
        background: #7d4be2;
        color: white;
        font: inherit;
      }

      [popover] {
        width: 260px;
        padding: 20px;
        border: 1px solid #17211b;
        border-radius: 12px;
        background: white;
        box-shadow: 0 18px 42px rgba(23, 33, 38, 0.24);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Native popover assurance</h1>
      <button type="button" popovertarget="review-menu">Review open menu</button>
      <div id="review-menu" popover role="menu">
        <strong>Review options</strong>
        <p>The native top-layer state must not be flattened silently.</p>
      </div>
    </main>
    <script>
      document.querySelector("#review-menu").showPopover();
    </script>
  </body>
</html>
