name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:unit

  fast:
    name: Fast product gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:e2e
      - run: pnpm test:browser-adapter
      - run: pnpm test:performance

  release-gate:
    name: OSS release gate
    needs:
      - compatibility
      - fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:release:browsers
      - run: pnpm test:browser-adapter
      - run: pnpm test:skills
      - run: pnpm test:skills:global
      - run: pnpm package:smoke
      - name: Verify the private-source public export
        if: ${{ hashFiles('scripts/export-public.mjs') != '' }}
        run: node scripts/export-public.mjs --verify
      - run: mkdir -p release
      - run: npm pack ./packages/cli --pack-destination release
      - name: Run the rollback drill
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$version" = "0.1.0" ]; then
            pnpm release:rollback -- --bootstrap --bad "$version" --fixed 0.1.1
          else
            prior=""
            for tag in $(git tag --merged HEAD --sort=-version:refname --list "v*"); do
              candidate="${tag#v}"
              if [ "$candidate" != "$version" ]; then
                prior="$candidate"
                break
              fi
            done
            if [ -z "$prior" ]; then
              echo "No prior release tag is available for the rollback drill." >&2
              exit 1
            fi
            pnpm release:rollback -- --bad "$version" --prior "$prior"
          fi
      - name: Generate release metadata
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm release:metadata
      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: showkit-release-candidate
          path: release/
          if-no-files-found: error
