name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    if: ${{ github.event.repository.private == false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:unit

  fast:
    name: Fast product gate
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - run: pnpm docs:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:e2e
      - run: pnpm test:browser-adapter
      - run: pnpm test:performance

  release-gate:
    name: OSS release gate
    if: ${{ github.event.repository.private == false }}
    needs:
      - compatibility
      - fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - run: pnpm audit:prod
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:release:browsers
      - run: pnpm test:browser-adapter
      - run: pnpm test:skills
      - run: pnpm test:skills:global
      - run: pnpm package:smoke
      - name: Verify the private-source public export
        if: ${{ hashFiles('scripts/export-public.mjs') != '' }}
        run: node scripts/export-public.mjs --verify
      - run: mkdir -p release
      - run: npm pack ./packages/cli --pack-destination release
      - name: Run the rollback drill
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$version" = "0.1.0" ]; then
            pnpm release:rollback -- --bootstrap --bad "$version" --fixed 0.1.1
          else
            prior=""
            for tag in $(git tag --merged HEAD --sort=-version:refname --list "v*"); do
              candidate="${tag#v}"
              if [ "$candidate" != "$version" ]; then
                prior="$candidate"
                break
              fi
            done
            if [ -z "$prior" ]; then
              package_name=$(node -p "require('./packages/cli/package.json').name")
              prior=$(npm view "$package_name" versions --json | node --input-type=module -e '
                import semver from "semver";
                let input = "";
                for await (const chunk of process.stdin) input += chunk;
                const badVersion = process.argv[1];
                const parsed = JSON.parse(input);
                const versions = Array.isArray(parsed) ? parsed : [parsed];
                const prior = versions
                  .filter((candidate) => semver.valid(candidate) && semver.lt(candidate, badVersion))
                  .sort(semver.compare)
                  .at(-1);
                process.stdout.write(prior ?? "");
              ' "$version")
            fi
            if [ -z "$prior" ]; then
              echo "No prior release tag or published registry version is available for the rollback drill." >&2
              exit 1
            fi
            pnpm release:rollback -- --bad "$version" --prior "$prior"
          fi
      - name: Generate release metadata
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm release:metadata
      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showkit-release-candidate
          path: release/
          if-no-files-found: error
